timeout: 10
wallpaper: boot():/wallpaper.png
term_background: FF000000
term_foreground: CCCCCCCC
interface_branding_colour: AA0000
interface_help_hidden: no
interface_help_colour: AA0000
interface_branding: bleedkernel.com (Limine 12.9.2)
editor_validation: no

/The Bleed Kernel
    protocol: limine
    path: boot():/boot/bleed-kernel
    MODULE_PATH=boot():/boot/initrd.tar
    MODULE_STRING=initrd
    kaslr: yes
    cmdline: shell=/initrd/bin/verdict init=/initrd/bin/crime-scene

/Boot Options
//TTY Mode (Boot to a shell)
    protocol: limine
    path: boot():/boot/bleed-kernel
    MODULE_PATH=boot():/boot/initrd.tar
    MODULE_STRING=initrd
    kaslr: yes
    cmdline: shell=/initrd/bin/verdict init=/initrd/bin/verdict

//Feeble Mode (for Underpowered Machines)
    protocol: limine
    path: boot():/boot/bleed-kernel
    MODULE_PATH=boot():/boot/initrd.tar
    resolution: 960x540
    kaslr: no
    cmdline: shell=/initrd/bin/verdict init=/initrd/bin/crime-scene
